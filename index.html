        // --- GENERADOR DE EFECTOS DE SONIDO SINTETIZADOS ---
        const playSoundEffect = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'bell') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(293.66, ctx.currentTime + 1.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.2);
                } else if (type === 'gong') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(110, ctx.currentTime);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.0);
                    osc.start();
                    osc.stop(ctx.currentTime + 2.0);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'warning') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {
                // AudioContext initialized after user gesture
            }
        };

        function App() {
            // NAVEGACIÓN: 'setup' | 'night' | 'day' | 'grimoire'
            const [activeTab, setActiveTab] = useState('setup');

            // CONFIGURACIÓN DE MESA
            const [numPlayers, setNumPlayers] = useState(8);
            const [enableGhostShield, setEnableGhostShield] = useState(true);
            const [playerList, setPlayerList] = useState([
                { id: "1", name: "Carlos", roleId: "WEREWOLF" },
                { id: "2", name: "Sofía", roleId: "WEREWOLF" },
                { id: "3", name: "Lucía", roleId: "SEER" },
                { id: "4", name: "Mateo", roleId: "BODYGUARD" },
                { id: "5", name: "Elena", roleId: "WITCH" },
                { id: "6", name: "Diego", roleId: "SPELLCASTER" },
                { id: "7", name: "Martín", roleId: "VILLAGER" },
                { id: "8", name: "Valentina", roleId: "VILLAGER" }

            // ESTADO DE JUEGO
            const [gamePhase, setGamePhase] = useState('SETUP');
            const [nightNumber, setNightNumber] = useState(1);
            const [dayNumber, setDayNumber] = useState(1);

            // JUGADORES Y ESTADOS DINÁMICOS
            const [gameStatePlayers, setGameStatePlayers] = useState([]);
            const [werewolvesSick, setWerewolvesSick] = useState(false);
            const [silencedPlayerId, setSilencedPlayerId] = useState(null);
            const [expelledPlayerId, setExpelledPlayerId] = useState(null);
            const [ghostShieldedPlayerId, setGhostShieldedPlayerId] = useState(null);

            // GUÍA NOCTURNA PASO A PASO
            const [nightSteps, setNightSteps] = useState([]);
            const [currentStepIdx, setCurrentStepIdx] = useState(0);
            const [nightActions, setNightActions] = useState({});
            const [morningRecap, setMorningRecap] = useState([]);

            // TEMPORIZADOR DIURNO
            const [timerSeconds, setTimerSeconds] = useState(240);
            const [timerActive, setTimerActive] = useState(false);

            // LOG DE EVENTOS
            const [eventLog, setEventLog] = useState([]);

            const addLog = (text) => {
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                setEventLog(prev => [{ id: Date.now() + Math.random(), time: timeStr, text }, ...prev]);
            };

            // Ajustar número de jugadores
            const handleNumPlayersChange = (val) => {
                const count = Math.max(4, Math.min(35, val));
                setNumPlayers(count);
                setPlayerList(prev => {
                    if (prev.length < count) {
                        const added = [];
                        for (let i = prev.length + 1; i <= count; i++) {
                            added.push({ id: String(i), name: `Jugador ${i}`, roleId: "VILLAGER" });
                        }
                        return [...prev, ...added];
                    } else {
                        return prev.slice(0, count);
                    }
                });
            };

            const updatePlayerName = (idx, name) => {
                setPlayerList(prev => {
                    const copy = [...prev];
                    copy[idx] = { ...copy[idx], name };
                    return copy;
                });
            };

            const updatePlayerRole = (idx, roleId) => {
                setPlayerList(prev => {
                    const copy = [...prev];
                    copy[idx] = { ...copy[idx], roleId };
                    return copy;
                });
            };

            // Cargar Ejemplo Rápido de 10 Jugadores
            const loadExampleGame = () => {
                const example = [
                    { id: "1", name: "Gonzalo", roleId: "WEREWOLF" },
                    { id: "2", name: "Camila", roleId: "WEREWOLF" },
                    { id: "3", name: "Ignacio", roleId: "SEER" },
                    { id: "4", name: "Mariana", roleId: "BODYGUARD" },
                    { id: "5", name: "Joaquín", roleId: "WITCH" },
                    { id: "6", name: "Paula", roleId: "SPELLCASTER" },
                    { id: "7", name: "Rodrigo", roleId: "OLD_HAG" },
                    { id: "8", name: "Federico", roleId: "VILLAGER" },
                    { id: "9", name: "Agustina", roleId: "VILLAGER" },
                    { id: "10", name: "Santiago", roleId: "VILLAGER" }
                ];
                setNumPlayers(10);
                setPlayerList(example);
                addLog("📋 Ejemplo de partida cargado con 10 jugadores.");
            };

            // Repartir roles aleatoriamente
            const shuffleRoles = () => {
                let pool = ["WEREWOLF", "WEREWOLF", "SEER", "BODYGUARD", "WITCH", "SPELLCASTER"];
                while (pool.length < playerList.length) {
                    pool.push("VILLAGER");
                }
                pool = pool.sort(() => Math.random() - 0.5);

                setPlayerList(prev => prev.map((p, i) => ({
                    ...p,
                    roleId: pool[i] || "VILLAGER"
                })));
                addLog("🎲 Roles repartidos aleatoriamente en la lista.");
            };

            // INICIAR PARTIDA
            const startGame = () => {
                playSoundEffect('gong');
                const initial = playerList.map(p => ({
                    ...p,
                    alive: true,
                    status: 'VIVO',
                    isGhostShielded: false
                }));

                setGameStatePlayers(initial);
                setGamePhase('NIGHT');
                setNightNumber(1);
                setDayNumber(1);
                setEventLog([]);
                addLog("📜 ¡Comienza la partida! Transición a la Noche 1.");

                buildNightSequence(1, initial);
                setActiveTab('night');
            };

            // CONSTRUIR SECUENCIA PASO A PASO
            const buildNightSequence = (nNum, currentPlayers) => {
                const nightField = nNum === 1 ? 'wakeNight1' : 'wakeNight2';
                let steps = [];

                // Paso 0: Dormir a todos
                steps.push({
                    id: "SLEEP_ALL",
                    titleEn: "SLEEP ALL",
                    titleEs: "DORMIR A LA ALDEA",
                    playerName: "TODOS LOS JUGADORES",
                    roleTitleEn: "VILLAGE",
                    roleTitleEs: "ALDEA COMPLETA",
                    script: "«La noche cae sobre la aldea. Todos los jugadores cierren los ojos y mantengan silencio absoluto.»",
                    whyWake: "Anuncio de inicio de la fase nocturna para que toda la mesa cierre los ojos antes de empezar las llamadas individuales.",
                    type: "INFO"
                });

                // Filtrar roles a despertar
                let wakingRoles = MASTER_ROLES_DB.filter(r => {
                    if (r[nightField] <= 0) return false;

                    if (['WEREWOLF', 'ALPHA_WOLF', 'WOLF_CUB', 'LONE_WOLF'].includes(r.id)) {
                        return currentPlayers.some(p => p.alive && ['WEREWOLF', 'ALPHA_WOLF', 'WOLF_CUB', 'LONE_WOLF'].includes(p.roleId));
                    }
                    if (r.id === 'VAMPIRE') {
                        return currentPlayers.some(p => p.alive && p.roleId === 'VAMPIRE');
                    }
                    if (r.id === 'MASON') {
                        return nNum === 1 && currentPlayers.some(p => p.roleId === 'MASON');
                    }
                    return currentPlayers.some(p => p.alive && p.roleId === r.id);
                });

                wakingRoles.sort((a, b) => a[nightField] - b[nightField]);

                // Generar los pasos con separación anti-confusión
                wakingRoles.forEach(roleDef => {
                    const matched = currentPlayers.filter(p => p.alive && (
                        p.roleId === roleDef.id || 
                        (['WEREWOLF', 'ALPHA_WOLF', 'WOLF_CUB', 'LONE_WOLF'].includes(roleDef.id) && ['WEREWOLF', 'ALPHA_WOLF', 'WOLF_CUB', 'LONE_WOLF'].includes(p.roleId))
                    ));

                    const namesStr = matched.map(p => p.name).join(", ");

                    if (['WEREWOLF', 'ALPHA_WOLF', 'WOLF_CUB', 'LONE_WOLF'].includes(roleDef.id)) {
                        if (werewolvesSick) {
                            steps.push({
                                id: "WEREWOLF_SICK",
                                titleEn: "WEREWOLVES (DISEASED)",
                                titleEs: "HOMBRES LOBO (ENFERMOS)",
                                playerName: namesStr,
                                roleTitleEn: "WEREWOLVES",
                                roleTitleEs: "HOMBRES LOBO",
                                script: "«Hombres Lobo: Despierten... Están enfermos por devorar al Apestado la noche anterior. ESTA NOCHE NO PUEDEN ELIMINAR A NADIE. Vuelvan a dormir.»",
                                whyWake: roleDef.whyWake,
                                type: "INFO"
                            });
                        } else {
                            steps.push({
                                id: "WEREWOLF_KILL",
                                titleEn: "WEREWOLVES / HOMBRES LOBO",
                                titleEs: "HOMBRES LOBO",
                                playerName: namesStr,
                                roleTitleEn: "WEREWOLVES",
                                roleTitleEs: "HOMBRES LOBO",
                                script: "«Hombres Lobo: Despierten en silencio, pónganse de acuerdo y señalen a la persona que van a eliminar esta noche.»",
                                whyWake: roleDef.whyWake,
                                type: "ACTION_SELECT_SINGLE",
                                actionKey: "WOLF_KILL"
                            });
                        }
                    } else if (roleDef.id === 'CUPID' && nNum === 1) {
                        steps.push({
                            id: "CUPID_STEP",
                            titleEn: "CUPID / CÚPIDO",
                            titleEs: "CÚPIDO",
                            playerName: namesStr,
                            roleTitleEn: "CUPID",
                            roleTitleEs: "CÚPIDO",
                            script: "«Cúpido: Despierta. Señala a 2 jugadores para vincularlos entre sí. Cúpido se duerme. Enamorados despierten y reconózcanse.»",
                            whyWake: roleDef.whyWake,
                            type: "ACTION_SELECT_DOUBLE",
                            actionKey: "LOVERS"
                        });
                    } else if (roleDef.id === 'BODYGUARD') {
                        steps.push({
                            id: "BODYGUARD_STEP",
                            titleEn: "BODYGUARD / ESCOLTA",
                            titleEs: "ESCOLTA",
                            playerName: namesStr,
                            roleTitleEn: "BODYGUARD",
                            roleTitleEs: "ESCOLTA",
                            script: "«Escolta: Despierta. Señala al jugador que protegerás esta noche contra la eliminación.»",
                            whyWake: roleDef.whyWake,
                            type: "ACTION_SELECT_SINGLE",
                            actionKey: "BODYGUARD_TARGET"
                        });
                    } else if (roleDef.id === 'SEER' || roleDef.id === 'MYSTIC_SEER' || roleDef.id === 'AURA_SEER') {
                        steps.push({
                            id: `SEER_STEP_${roleDef.id}`,
                            titleEn: `${roleDef.titleEn} / ${roleDef.titleEs}`,
                            titleEs: roleDef.titleEs,
                            playerName: namesStr,
                            roleTitleEn: roleDef.titleEn,
                            roleTitleEs: roleDef.titleEs,
                            script: `«${roleDef.titleEs} (${roleDef.titleEn}): Despierta. Señala a un jugador para investigar su naturaleza. Te responderé con la seña correspondiente.»`,
                            whyWake: roleDef.whyWake,
                            type: "INFO"
                        });
                    } else if (roleDef.id === 'WITCH') {
                        steps.push({
                            id: "WITCH_STEP",
                            titleEn: "WITCH / BRUJA",
                            titleEs: "BRUJA",
                            playerName: namesStr,
                            roleTitleEn: "WITCH",
                            roleTitleEs: "BRUJA",
                            script: "«Bruja: Despierta. Te muestro la víctima elegida esta noche. ¿Deseas usar tu poción de curación o tu poción de veneno?»",
                            whyWake: roleDef.whyWake,
                            type: "ACTION_WITCH",
                            actionKey: "WITCH_ACTIONS"
                        });
                    } else if (roleDef.id === 'SPELLCASTER') {
                        steps.push({
                            id: "SPELLCASTER_STEP",
                            titleEn: "SPELLCASTER / LANZACONJUROS",
                            titleEs: "LANZACONJUROS",
                            playerName: namesStr,
                            roleTitleEn: "SPELLCASTER",
                            roleTitleEs: "LANZACONJUROS",
                            script: "«Lanzaconjuros: Despierta. Señala al jugador que estará silenciado y no podrá hablar durante el día de mañana.»",
                            whyWake: roleDef.whyWake,
                            type: "ACTION_SELECT_SINGLE",
                            actionKey: "SILENCE_TARGET"
                        });
                    } else if (roleDef.id === 'OLD_HAG') {
                        steps.push({
                            id: "OLD_HAG_STEP",
                            titleEn: "OLD HAG / VIEJA BRUJA",
                            titleEs: "VIEJA BRUJA",
                            playerName: namesStr,
                            roleTitleEn: "OLD HAG",
                            roleTitleEs: "VIEJA BRUJA",
                            script: "«Vieja Bruja: Despierta. Señala al jugador que deberá abandonar la aldea durante el día de mañana.»",
                            whyWake: roleDef.whyWake,
                            type: "ACTION_SELECT_SINGLE",
                            actionKey: "EXPEL_TARGET"
                        });
                    } else {
                        steps.push({
                            id: `STEP_${roleDef.id}`,
                            titleEn: `${roleDef.titleEn} / ${roleDef.titleEs}`,
                            titleEs: roleDef.titleEs,
                            playerName: namesStr,
                            roleTitleEn: roleDef.titleEn,
                            roleTitleEs: roleDef.titleEs,
                            script: `«${roleDef.titleEs} (${roleDef.titleEn}): Despierta y realiza tu acción especial de noche. Puedes volver a dormir.»`,
                            whyWake: roleDef.whyWake,
                            type: "INFO"
                        });
                    }
                });

                // Paso Final: Despertar
                steps.push({
                    id: "WAKE_ALL",
                    titleEn: "WAKE ALL",
                    titleEs: "DESPERTAR A LA ALDEA",
                    playerName: "TODOS LOS JUGADORES",
                    roleTitleEn: "VILLAGE",
                    roleTitleEs: "AMANECER",
                    script: "«La noche ha terminado. ¡Todos abran los ojos! La aldea despierta para conocer lo sucedido.»",
                    whyWake: "Concluye la fase nocturna. El moderador anuncia las muertes ocurridas o confirma si la noche transcurrió limpia sin caídos.",
                    type: "FINISH_NIGHT"
                });

                setNightSteps(steps);
                setCurrentStepIdx(0);
                setNightActions({});
            };

            // CONCLUIR NOCHE E INICIAR DÍA
            const processNightAndWakeDay = () => {
                playSoundEffect('bell');
                let newPlayers = [...gameStatePlayers];
                let deaths = new Set();
                let protections = new Set();

                if (nightActions["BODYGUARD_TARGET"]) protections.add(nightActions["BODYGUARD_TARGET"]);
                if (nightActions["WITCH_HEAL"]) protections.add(nightActions["WITCH_HEAL"]);

                const wolfTarget = nightActions["WOLF_KILL"];
                const witchKillTarget = nightActions["WITCH_KILL"];

                if (wolfTarget) {
                    const victim = newPlayers.find(p => p.id === wolfTarget);
                    if (victim) {
                        if (victim.roleId === 'DISEASED') {
                            setWerewolvesSick(true);
                            addLog("🦠 Hombres Lobo devoraron al Apestado: ¡Estarán enfermos la próxima noche!");
                        }
                        if (victim.roleId === 'CURSED') {
                            victim.roleId = 'WEREWOLF';
                            addLog(`🩸 ¡El Maldito (${victim.name}) fue atacado y se transformó en HOMBRE LOBO!`);
                        } else if (!protections.has(victim.id)) {
                            deaths.add(victim.id);
                        } else {
                            addLog(`🛡️ El ataque nocturno sobre ${victim.name} fue protegido con éxito.`);
                        }
                    }
                }

                if (witchKillTarget && !protections.has(witchKillTarget)) {
                    deaths.add(witchKillTarget);
                }

                // Procesar muertes
                newPlayers = newPlayers.map(p => {
                    if (deaths.has(p.id)) {
                        return { ...p, alive: false, status: 'MUERTO' };
                    }
                    return p;
                });

                setSilencedPlayerId(nightActions["SILENCE_TARGET"] || null);
                setExpelledPlayerId(nightActions["EXPEL_TARGET"] || null);

                setGameStatePlayers(newPlayers);
                const deadTonight = newPlayers.filter(p => deaths.has(p.id));
                setMorningRecap(deadTonight);

                if (werewolvesSick) setWerewolvesSick(false);

                setGamePhase('DAY');
                setActiveTab('day');
                setTimerSeconds(newPlayers.filter(p => p.alive).length * 30);
                setTimerActive(false);

                if (deadTonight.length === 0) {
                    addLog(`🌅 Día ${dayNumber}: Noche limpia. ¡Nadie ha muerto durante la noche!`);
                } else {
                    addLog(`🌅 Día ${dayNumber}: Se confirmó la muerte de ${deadTonight.length} jugador(es).`);
                }
            };

            // Otorgar Escudo Fantasma por mayoría de muertos
            const grantGhostShield = (targetPlayerId) => {
                playSoundEffect('gong');
                const target = gameStatePlayers.find(p => p.id === targetPlayerId);
                if (!target) return;

                setGhostShieldedPlayerId(targetPlayerId);
                addLog(`👻🛡️ ¡LOS FANTASMAS VOTARON POR MAYORÍA! Otorgan el Escudo Fantasma a ${target.name}. Queda protegido contra ejecuciones hoy.`);
            };

            // Ejecución Diurna por Votación
            const executePlayer = (playerId) => {
                playSoundEffect('bell');
                if (playerId === ghostShieldedPlayerId) {
                    addLog(`🛡️ ¡${gameStatePlayers.find(p=>p.id===playerId)?.name} TIENE EL ESCUDO FANTASMA! Se salva de la ejecución.`);
                    return;
                }

                let newPlayers = [...gameStatePlayers];
                const target = newPlayers.find(p => p.id === playerId);
                if (!target) return;

                if (target.roleId === 'PRINCE') {
                    addLog(`👑 ¡${target.name} revela que es el PRÍNCIPE! Se salva automáticamente de la ejecución.`);
                    return;
                }

                target.alive = false;
                target.status = 'EJECUTADO';
                setGameStatePlayers(newPlayers);
                addLog(`⚖️ La aldea votó y ejecutó a ${target.name} (${MASTER_ROLES_DB.find(r=>r.id===target.roleId)?.titleEn}).`);
            };

            // AVANZAR MANUALMENTE A LA SIGUIENTE NOCHE
            const advanceToNextNight = () => {
                playSoundEffect('gong');
                const nextN = nightNumber + 1;
                setNightNumber(nextN);
                setDayNumber(dayNumber + 1);
                setGhostShieldedPlayerId(null);
                setGamePhase('NIGHT');

                buildNightSequence(nextN, gameStatePlayers);
                setActiveTab('night');
                addLog(`🌙 Transición manual a la Noche ${nextN}.`);
            };

            // Temporizador Diurno
            useEffect(() => {
                let timer = null;
                if (timerActive && timerSeconds > 0) {
                    timer = setInterval(() => {
                        setTimerSeconds(s => s - 1);
                    }, 1000);
                } else if (timerSeconds === 0 && timerActive) {
                    setTimerActive(false);
                    playSoundEffect('warning');
                    addLog("⏰ ¡El tiempo del debate diurno ha finalizado!");
                }
                return () => clearInterval(timer);
            }, [timerActive, timerSeconds]);

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div class="min-h-screen flex flex-col justify-between max-w-6xl mx-auto px-3 sm:px-4 py-4">
                    {/* ENCABEZADO Y TABS */}
                    <header class="bg-grim-card/95 border border-grim-border rounded-xl p-4 mb-4 flex flex-wrap items-center justify-between shadow-2xl">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg gold-glow">
                                <i class="fa-solid fa-book-skull"></i>
                            </div>
                            <div>
                                <h1 class="cinzel-font text-lg sm:text-2xl font-black text-amber-400 tracking-wider">EL GRIMORIO DEL MODERADOR</h1>
                                <p class="text-xs text-slate-400">Ultimate Werewolf • Asistente Bilingüe de Presencial</p>
                            </div>
                        </div>

                        {/* Estado Superior */}
                        {gamePhase !== 'SETUP' && (
                            <div class="flex items-center space-x-2 sm:space-x-3 my-2 sm:my-0 text-xs font-semibold">
                                <span class="bg-grim-bg px-3 py-1.5 rounded-lg border border-grim-border">🌙 Noche <strong class="text-amber-400">{nightNumber}</strong></span>
                                <span class="bg-grim-bg px-3 py-1.5 rounded-lg border border-grim-border">☀️ Día <strong class="text-amber-400">{dayNumber}</strong></span>
                                <span class="bg-grim-bg px-3 py-1.5 rounded-lg border border-grim-border">💚 Vivos: <strong class="text-emerald-400">{gameStatePlayers.filter(p=>p.alive).length}</strong>/{gameStatePlayers.length}</span>
                            </div>
                        )}

                        {/* Botones de Navegación de Pestañas */}
                        <nav class="flex space-x-1 sm:space-x-2 w-full sm:w-auto justify-end mt-2 sm:mt-0">
                            <button 
                                onClick={() => setActiveTab('setup')}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 ${activeTab === 'setup' ? 'bg-amber-500 text-slate-950 gold-glow' : 'bg-grim-bg text-slate-300 hover:bg-grim-border'}`}>
                                <i class="fa-solid fa-sliders"></i>
                                <span>Ajustes</span>
                            </button>
                            {gamePhase !== 'SETUP' && (
                                <>
                                    <button 
                                        onClick={() => setActiveTab('night')}
                                        class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 ${activeTab === 'night' ? 'bg-indigo-600 text-white purple-glow' : 'bg-grim-bg text-slate-300 hover:bg-grim-border'}`}>
                                        <i class="fa-solid fa-moon"></i>
                                        <span>Guía Noche</span>
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('day')}
                                        class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 ${activeTab === 'day' ? 'bg-amber-600 text-white gold-glow' : 'bg-grim-bg text-slate-300 hover:bg-grim-border'}`}>
                                        <i class="fa-solid fa-sun"></i>
                                        <span>Día & Votos</span>
                                    </button>
                                </>
                            )}
                            <button 
                                onClick={() => setActiveTab('grimoire')}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 ${activeTab === 'grimoire' ? 'bg-amber-500 text-slate-950 gold-glow' : 'bg-grim-bg text-slate-300 hover:bg-grim-border'}`}>
                                <i class="fa-solid fa-chess-board"></i>

                                                            <span class="font-bold text-sm text-slate-100">{p.name}</span>
                                                            <span class={`text-[10px] px-2 py-0.5 rounded font-black ${p.alive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}`}>
                                                                {p.alive ? 'VIVO' : 'MUERTO'}
                                                            </span>
                                                        </div>
                                                        <div class="text-xs font-bold text-amber-400 mb-1">Rol: {roleDef?.titleEn} / {roleDef?.titleEs}</div>
                                                        <div class="text-[11px] text-slate-500 mb-2">Bando: {roleDef?.team}</div>

                                                        {isProtectedByGhost && (
                                                            <span class="inline-block text-[10px] bg-sky-900/60 text-sky-200 px-2 py-0.5 rounded font-bold">👻 Escudo Fantasma</span>
                                                        )}
                                                    </div>

                                                    <div class="pt-2 border-t border-grim-border flex justify-end">
                                                        <button 
                                                            onClick={() => {
                                                                setGameStatePlayers(prev => prev.map(x => x.id === p.id ? { ...x, alive: !x.alive } : x));
                                                            }}
                                                            class={`px-2.5 py-1 rounded text-[11px] font-bold transition ${p.alive ? 'bg-rose-900 text-rose-200' : 'bg-emerald-900 text-emerald-200'}`}>
                                                            {p.alive ? 'Marcar Muerto' : 'Revivir'}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Registro Completo de Eventos */}
                                <div class="bg-grim-card border border-grim-border rounded-xl p-5 space-y-2">
                                    <h3 class="cinzel-font text-sm font-bold text-amber-400 uppercase">HISTORIAL CRONOLÓGICO DE EVENTOS</h3>
                                    <div class="bg-grim-bg p-3 rounded-xl border border-grim-border max-h-48 overflow-y-auto space-y-1 font-mono text-xs text-slate-300">
                                        {eventLog.map(item => (
                                            <div key={item.id} class="flex space-x-2">
                                                <span class="text-amber-500 font-bold">[{item.time}]</span>
                                                <span>{item.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer class="mt-8 text-center text-xs text-slate-500 border-t border-grim-border/50 pt-4">
                        El Grimorio del Moderador • Ultimate Werewolf Presencial
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
